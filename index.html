function cylX(y,z,r,x,X,c,n=16){for(let k=0;k<n;k++){let a=k*2*Math.PI/n,b=(k+1)*2*Math.PI/n;face([[x,y+r*Math.cos(a),z+r*Math.sin(a)],[x,y+r*Math.cos(b),z+r*Math.sin(b)],[X,y+r*Math.cos(b),z+r*Math.sin(b)],[X,y+r*Math.cos(a),z+r*Math.sin(a)]],c)}}
function ringY(x,z,r,R,y,Y,c,n=20){const p=(rr,a,yy)=>[x+rr*Math.cos(a),yy,z+rr*Math.sin(a)];for(let k=0;k<n;k++){let a=k*2*Math.PI/n,b=(k+1)*2*Math.PI/n;face([p(r,a,y),p(R,a,y),p(R,b,y),p(r,b,y)],c);face([p(R,a,y),p(R,b,y),p(R,b,Y),p(R,a,Y)],c)}}

function tube(points,r,c){const n=12;for(let i=0;i<points.length-1;i++){let a=points[i],b=points[i+1],d=b.map((v,j)=>v-a[j]),l=Math.hypot(...d)||1,t=d.map(v=>v/l),u=Math.abs(t[2])<.9?[-t[1],t[0],0]:[0,-t[2],t[1]],ul=Math.hypot(...u)||1;u=u.map(v=>v/ul);let v=[t[1]*u[2]-t[2]*u[1],t[2]*u[0]-t[0]*u[2],t[0]*u[1]-t[1]*u[0]];const p=(q,ang)=>q.map((x,j)=>x+r*(u[j]*Math.cos(ang)+v[j]*Math.sin(ang)));for(let k=0;k<n;k++){let aa=k*2*Math.PI/n,bb=(k+1)*2*Math.PI/n;face([p(a,aa),p(a,bb),p(b,bb),p(b,aa)],c)}}}

 [[148,2],[468,2],[468,48],[148,48]],

];

 face(poly.map(([x,y])=>[x,y,321]),'metal');
 face([...poly].reverse().map(([x,y])=>[x,y,319]),'metal');
}

 const a=coverOutline[i],b=coverOutline[(i+1)%coverOutline.length];
 face([[a[0],a[1],319],[b[0],b[1],319],[b[0],b[1],321],[a[0],a[1],321]],'metal');

for(const [a,b] of [ [[368,143],[368,243]], [[368,143],[468,143]] ]){
 face([[a[0],a[1],319],[b[0],b[1],319],[b[0],b[1],321],[a[0],a[1],321]],'metal');

// Последний согласованный маршрут: внутренняя сторона задней стенки, y=239.
